name: Package and Release Skills

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package skills into zip archives
        run: |
          mkdir -p dist
          skill_dirs=()
          for dir in */; do
            if [ -f "${dir}SKILL.md" ]; then
              skill_name="${dir%/}"
              skill_dirs+=("$skill_name")
              echo "Packaging individual skill: $skill_name"
              zip -r "dist/${skill_name}.zip" "$skill_name" -x "*.DS_Store" -x "*__MACOSX*" -x "*/.DS_Store*" -x "*.git*"
            fi
          done

          if [ ${#skill_dirs[@]} -eq 0 ]; then
            echo "Error: No skill directories containing SKILL.md found!"
            exit 1
          fi

          echo "Packaging all skills combined (${skill_dirs[*]}): dist/skills.zip"
          zip -r dist/skills.zip "${skill_dirs[@]}" -x "*.DS_Store" -x "*__MACOSX*" -x "*/.DS_Store*" -x "*.git*"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skills-bundle
          path: dist/skills.zip
          retention-days: 90

      - name: Update latest git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Skills Release"
          body: |
            📦 **Skills Bundle**

            - 📥 **[Download all skills (skills.zip)](https://github.com/${{ github.repository }}/releases/latest/download/skills.zip)**

            *Automatically updated on push to main (commit: `${{ github.sha }}`).*
          files: dist/*.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
