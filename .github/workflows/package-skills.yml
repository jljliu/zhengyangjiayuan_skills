name: Package and Release Skills

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zhengyang-skills-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package skills into zip archives
        run: |
          python3 scripts/package_skills.py --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Test packaging and invocation-time updates
        run: python3 -m unittest discover -s tests -v

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skills-bundle
          path: dist/
          retention-days: 90

      - name: Check whether this build is still the current main commit
        id: release_gate
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping publication of this outdated build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update latest git tag
        if: steps.release_gate.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Publish Latest Release
        if: steps.release_gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Skills Release"
          body: |
            📦 **Skills Bundle**

            - 📥 **[Download all skills (skills.zip)](https://github.com/${{ github.repository }}/releases/latest/download/skills.zip)**

            *Automatically updated on push to main (commit: `${{ github.sha }}`).*
          files: dist/*.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish update manifest after ZIP uploads succeed
        if: steps.release_gate.outputs.publish == 'true'
        run: gh release upload latest dist/manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
